<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Audio Tracks</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #6b7280;
    --line: #e5e7eb;
    --head: #f9fafb;
    --hover: #f6f8fb;
    --accent: #e11d48;
    --accent-soft: #ffe4e8;
    --chip: #f1f3f6;
    --chip-line: #dfe3e8;
    --err: #dc2626;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #e6e8eb;
      --muted: #9aa3af;
      --line: #2a2f39;
      --head: #1c2029;
      --hover: #1e232d;
      --accent: #fb7185;
      --accent-soft: #3a1820;
      --chip: #222733;
      --chip-line: #323846;
      --err: #f87171;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { padding: 24px 32px; }

  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .logo { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 18px; flex: none; }
  h1 { margin: 0; font-size: 20px; font-weight: 650; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }

  form { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; padding: 16px; margin-bottom: 10px; }
  .note { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field.grow { flex: 1 1 360px; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 500; }
  input, select { height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); font: inherit; outline: none; }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #limit { width: 110px; }
  .actions { display: flex; gap: 8px; }
  button { height: 38px; padding: 0 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); font: inherit; font-weight: 500; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--hover); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }

  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 38px; margin-bottom: 12px; }
  #status { color: var(--muted); }
  #status.err { color: var(--err); }
  #pager { display: flex; gap: 8px; align-items: center; }
  #pager[hidden] { display: none; }
  #pageInfo { color: var(--muted); min-width: 90px; text-align: center; }

  .table-card { overflow: clip; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 10px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  tbody tr:last-child td { border-bottom: none; }
  th { position: sticky; top: 0; z-index: 1; background: var(--head); color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  tbody tr:hover td { background: var(--hover); }
  td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.date { white-space: nowrap; font-variant-numeric: tabular-nums; }
  td a { color: var(--text); text-decoration: none; font-weight: 500; }
  td a:hover { color: var(--accent); text-decoration: underline; }
  th { white-space: nowrap; }
  td.title { min-width: 240px; max-width: 420px; }

  .info { display: flex; align-items: center; gap: 12px; }
  #avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; flex: none; }
  #avatar[hidden], #chName[hidden] { display: none; }
  #chName { font-size: 16px; font-weight: 650; line-height: 1.3; }
  td.thumb { width: 1%; }
  td.thumb img { display: block; width: 120px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; background: var(--chip); }

  .tracks { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { display: inline-flex; align-items: center; height: 26px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--chip-line); background: var(--chip); font-size: 12px; white-space: nowrap; }
  .chip.orig { font-weight: 700; }
  .muted { color: var(--muted); }
  .err { color: var(--err); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">▶</div>
    <div>
      <h1>YouTube Audio Tracks</h1>
      <p>Danh sách video public của kênh kèm các audio track</p>
    </div>
  </header>

  <form id="form" class="card">
    <div class="field grow">
      <label for="url">Link kênh</label>
      <input id="url" placeholder="https://www.youtube.com/@MrBeast" required>
    </div>
    <div class="field">
      <label for="limit">Số video</label>
      <input id="limit" type="number" min="1" placeholder="Tất cả">
    </div>
    <div class="field">
      <label for="sort">Sắp xếp</label>
      <select id="sort">
        <option value="latest">Mới nhất</option>
        <option value="popular">Phổ biến</option>
        <option value="oldest">Cũ nhất</option>
      </select>
    </div>
    <div class="actions">
      <button id="start" class="primary" type="submit">Bắt đầu</button>
      <button id="stop" type="button" disabled>Dừng</button>
      <button id="csv" type="button" disabled>Xuất CSV</button>
    </div>
  </form>

  <p class="note">Nếu kênh có chặn IP Việt Nam thì bật VPN lên trước khi Quét.</p>

  <div class="bar">
    <div class="info">
      <img id="avatar" alt="" hidden>
      <div>
        <div id="chName" hidden></div>
        <div id="status"></div>
      </div>
    </div>
    <div id="pager" hidden>
      <button id="prev" type="button">‹ Trước</button>
      <span id="pageInfo"></span>
      <button id="next" type="button">Sau ›</button>
    </div>
  </div>

  <div class="card table-card">
    <table>
      <thead><tr><th class="num">#</th><th>Thumbnail</th><th>Title</th><th>Ngày public</th><th class="num">View</th><th class="num">Số track</th><th>Audio tracks</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>
<script src="yt.js"></script>
<script src="app.js"></script>
</body>
</html>
